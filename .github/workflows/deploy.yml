# =============================================================================
# deploy.yml
# CI/CD pipeline for azure-python-devops.
#
# On every push to main:
#   1. test          - install deps, run pytest against the FastAPI app
#   2. build-and-push - build the multi-stage Docker image and push it to ACR
#   3. terraform-deploy - run Terraform to (re)create/update infra and point
#                          the Azure Container Instance at the new image tag
#
# Required GitHub Secrets (see README.md "Step 1" for exact CLI commands):
#   AZURE_CREDENTIALS   - JSON output of `az ad sp create-for-rbac ... --sdk-auth`
#   REGISTRY_USERNAME   - ACR admin username (from `terraform output acr_admin_username`)
#   REGISTRY_PASSWORD   - ACR admin password (from `terraform output acr_admin_password`)
# =============================================================================

name: Build, Test, and Deploy to Azure (Free Tier)

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "*.md"
  workflow_dispatch: {}

env:
  PROJECT_NAME: azpydevops
  ACR_NAME: azpydevopsacr
  IMAGE_NAME: azpydevops
  TF_WORKING_DIR: infra

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------
  # Job 0: Scan for leaked secrets before anything else runs.
  # ---------------------------------------------------------------------
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ---------------------------------------------------------------------
  # Job 1: Run unit tests before building/deploying anything.
  # ---------------------------------------------------------------------
  test:
    name: Run pytest
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: app
        run: pytest -v
  sast:
    name: Semgrep SAST
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/python p/fastapi p/security-audit p/secrets

  dependency-scan:
    name: pip-audit dependency scan
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r app/requirements.txt --desc

  iac-scan:
    name: tfsec Terraform scan
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          soft_fail: true

  # ---------------------------------------------------------------------
  # Job 2: Build the Docker image and push it to Azure Container Registry.
  # ---------------------------------------------------------------------
  build-and-push:
    name: Build & push Docker image to ACR
    needs: [test, sast, dependency-scan, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag from Git SHA
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Push image (only if scan passed)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}

  # ---------------------------------------------------------------------
  # Azure App Service (Linux F1)
  # Job 3: Deploy/update infrastructure with Terraform, pointing ACI at
  # the freshly pushed image tag.
  # ---------------------------------------------------------------------
  terraform-deploy:
    name: Terraform apply (deploy to ACI)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -var="project_name=${{ env.PROJECT_NAME }}"
      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -var="project_name=${{ env.PROJECT_NAME }}"

      - name: Show deployed FQDN
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output aci_fqdn

      - name: Restart Azure App Service
        run: |
          az webapp restart \
            --resource-group azpydevops-rg \
            --name azpydevops-webapp
